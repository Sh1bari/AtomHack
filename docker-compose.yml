services:
  simulationpostgres:
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - "node.labels.region == ru"  # Запускаем только на RU сервере
    image: timescale/timescaledb:latest-pg16
    container_name: simulationpostgres
    environment:
      - POSTGRES_DB=simulation
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - atom-custom-network
    volumes:
      - simulation_postgres_data:/var/lib/postgresql/data

  redis:
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - "node.labels.region == ru"  # Запускаем только на RU сервере
    image: redis:latest
    container_name: redis
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - atom-custom-network

  simulation:
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - "node.labels.region == ru"  # Запускаем только на RU сервере
    image: registry.sh1bari.ru/atom/simulation:1.0.0
    environment:
      - POSTGRES_ADDRESS=simulationpostgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - traefik_network
      - atom-custom-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simulation.rule=Host(`hack.noxly.ru`)"
      - "traefik.http.routers.simulation.entrypoints=websecure"
      - "traefik.http.routers.simulation.tls=true"
      - "traefik.http.routers.simulation.tls.certresolver=myresolver"
      - "traefik.http.services.simulation.loadbalancer.server.port=8081"
      - "traefik.http.routers.simulation.priority=25"
      - "traefik.docker.network=traefik_network"

  socket:
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - "node.labels.region == ru"  # Запускаем только на RU сервере
    image: registry.sh1bari.ru/atom/socket:1.0.0
    ports:
      - "8082:8082"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - traefik_network
      - atom-custom-network
    labels:
      - "traefik.enable=true"
      # ---------- WebSocket (апгрейд для /api/ws) ----------
      - "traefik.http.routers.websocket.rule=Host(`ws.hack.noxly.ru`) && Path(`/api/ws`)"
      - "traefik.http.routers.websocket.entrypoints=websecure"
      - "traefik.http.routers.websocket.tls=true"
      - "traefik.http.routers.websocket.tls.certresolver=myresolver"
      - "traefik.http.services.websocket.loadbalancer.server.port=8082"
      - "traefik.http.routers.websocket.priority=30"

        # WebSocket Middleware (только для /api/ws)
      - "traefik.http.middlewares.websocket-headers.headers.customrequestheaders.Connection=Upgrade"
      - "traefik.http.middlewares.websocket-headers.headers.customrequestheaders.Upgrade=websocket"
      - "traefik.http.routers.websocket.middlewares=websocket-headers"

        # ---------- Обычные HTTPS-запросы (/api/*) ----------
      - "traefik.http.routers.api-socket.rule=Host(`ws.hack.noxly.ru`) && PathPrefix(`/api/ws/info`)"
      - "traefik.http.routers.api-socket.entrypoints=websecure"
      - "traefik.http.routers.api-socket.tls=true"
      - "traefik.http.routers.api-socket.tls.certresolver=myresolver"
      - "traefik.http.services.api-socket.loadbalancer.server.port=8082"
      - "traefik.http.routers.api-socket.priority=31"

networks:
  traefik_network:
    external: true
  atom-custom-network:
    external: true

volumes:
  simulation_postgres_data: